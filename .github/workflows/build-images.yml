name: Build platform images

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - ".github/workflows/build-images.yml"
      - "images/**"
      - "charts/**"
      - "scripts/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-images.yml"
      - "images/**"
      - "charts/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish images from the approved release workflow
        required: true
        default: false
        type: boolean
      release_tag:
        description: Optional artifact release tag, such as openbb-v1.2.3
        required: false
        type: string
  release:
    types:
      - published

jobs:
  discover:
    name: Discover image definitions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.images.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Validate manifests and build matrix
        id: images
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          CHANGE_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}
          CHANGE_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/image-matrix.py

  build-scan-smoke:
    name: Build, scan, and smoke test (${{ matrix.name }})
    needs: discover
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      contents: read
    env:
      CI_TAG: platform-images/${{ matrix.name }}:ci-${{ github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for validation
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.validation_platform }}
          load: true
          tags: ${{ env.CI_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run image smoke test
        if: matrix.smoke_test != ''
        run: bash "${{ matrix.smoke_test }}" "${CI_TAG}"

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.CI_TAG }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1

      - name: Lint Helm chart
        if: matrix.chart != ''
        run: helm lint "${{ matrix.chart }}"

  publish:
    name: Publish image (${{ matrix.name }})
    needs: [discover, build-scan-smoke]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && github.event.action == 'published') || (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-24.04
    environment: release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve artifact release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish == true && inputs.release_tag != '')
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          ARTIFACT_NAME: ${{ matrix.name }}
          ARTIFACT_VERSION: ${{ matrix.version }}
        run: |
          expected_prefix="${ARTIFACT_NAME}-v"
          if [[ "$RELEASE_TAG" != "$expected_prefix"* ]]; then
            echo "Release tag must start with ${expected_prefix}; got: $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#"$expected_prefix"}"
          if [[ "$version" != "$ARTIFACT_VERSION" ]]; then
            echo "Release version ${version} does not match ${ARTIFACT_NAME} manifest version ${ARTIFACT_VERSION}" >&2
            exit 1
          fi
          base_version="${version%%[-+]*}"
          IFS=. read -r major minor patch <<< "$base_version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major.$minor" >> "$GITHUB_OUTPUT"

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.release.outputs.version }},enable=${{ steps.release.outputs.version != '' }}
            type=raw,value=${{ steps.release.outputs.major_minor }},enable=${{ steps.release.outputs.major_minor != '' }}
            type=raw,value=${{ steps.release.outputs.major }},enable=${{ steps.release.outputs.major != '' }}
            type=sha,format=long

      - name: Package and publish Helm chart
        if: matrix.chart != '' && steps.release.outputs.version != ''
        id: chart
        env:
          CHART_PATH: ${{ matrix.chart }}
          CHART_VERSION: ${{ steps.release.outputs.version }}
          CHART_REPOSITORY: ghcr.io/${{ github.repository }}/charts
        run: |
          package_dir="$RUNNER_TEMP/helm-package"
          mkdir -p "$package_dir"
          helm package "$CHART_PATH" --destination "$package_dir" --version "$CHART_VERSION"
          push_output="$(helm push "$package_dir/${{ matrix.name }}-${CHART_VERSION}.tgz" "oci://${CHART_REPOSITORY}" 2>&1)"
          printf '%s\n' "$push_output"
          chart_digest="$(printf '%s\n' "$push_output" | awk '$1 == "Digest:" { print $2; exit }')"
          if [[ -z "$chart_digest" ]]; then
            echo 'Helm did not return a chart digest' >&2
            exit 1
          fi
          echo "digest=$chart_digest" >> "$GITHUB_OUTPUT"
          {
            echo "## Published ${{ matrix.name }} Helm chart"
            echo
            echo "\`${CHART_REPOSITORY}/${{ matrix.name }}:${CHART_VERSION}\`"
            echo
            echo "Retaining current/semantic packages and untagged OCI child manifests in GHCR; current digest: \`${chart_digest}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Retain current image package version
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ github.event.repository.name }}/${{ matrix.name }}
          KEEP_VERSION_NAME: ${{ steps.build.outputs.digest }}
        run: bash scripts/retain-ghcr-package-version.sh

      - name: Retain current Helm chart package version
        if: steps.chart.outputs.digest != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ github.event.repository.name }}/charts/${{ matrix.name }}
          KEEP_VERSION_NAME: ${{ steps.chart.outputs.digest }}
        run: bash scripts/retain-ghcr-package-version.sh

      - name: Record immutable digest
        run: |
          {
            echo "## Published ${{ matrix.name }} image"
            echo
            echo "\`${{ matrix.repository }}@${{ steps.build.outputs.digest }}\`"
            echo
            echo 'Deploy this digest through the corresponding chart with `--set image.digest=...`.'
          } >> "$GITHUB_STEP_SUMMARY"
