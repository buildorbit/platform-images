apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opencode.fullname" . }}-nginx
  labels:
    {{- include "opencode.labels" . | nindent 4 }}
data:
  default.conf: |
    server {
      listen 8080;
      server_tokens off;
      location / {
        proxy_pass http://127.0.0.1:4096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter '</body>' '<style>body{padding-top:24px}.pub-banner{position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#c62828;color:#fff;text-align:center;font:600 13px/22px system-ui,-apple-system,sans-serif;padding:0 12px;box-shadow:0 2px 8px rgba(0,0,0,.4)}</style><div class="pub-banner">{{ .Values.banner.text | replace "&" "&amp;" | replace "<" "&lt;" | replace ">" "&gt;" | replace "'" "&#39;" | replace "$" "&#36;" }}</div></body>';
      }
    }
