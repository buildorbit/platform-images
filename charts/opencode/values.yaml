replicaCount: 1
image:
  repository: ghcr.io/buildorbit/platform-images/opencode
  tag: latest
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []
nginx:
  image: nginx:1.30.6-alpine
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
auth:
  enabled: true
  existingSecret: ""
  usernameKey: username
  passwordKey: password
banner:
  text: "PUBLIC SESSION — information is used for training; do not enter sensitive data."
service:
  type: ClusterIP
  port: 8080
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []
persistence:
  enabled: true
  accessModes: [ReadWriteOnce]
  size: 5Gi
  storageClassName: ""
workspacePersistence:
  enabled: true
  accessModes: [ReadWriteOnce]
  size: 10Gi
  storageClassName: ""
opencodeResources: {}
nginxResources: {}
livenessProbe:
  exec:
    command:
      - node
      - -e
      - >-
        const auth=process.env.OPENCODE_SERVER_PASSWORD?{headers:{Authorization:'Basic '+Buffer.from((process.env.OPENCODE_SERVER_USERNAME||'opencode')+':'+process.env.OPENCODE_SERVER_PASSWORD).toString('base64')}}:{};fetch('http://127.0.0.1:4096/global/health',auth).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 5
readinessProbe:
  exec:
    command:
      - node
      - -e
      - >-
        const auth=process.env.OPENCODE_SERVER_PASSWORD?{headers:{Authorization:'Basic '+Buffer.from((process.env.OPENCODE_SERVER_USERNAME||'opencode')+':'+process.env.OPENCODE_SERVER_PASSWORD).toString('base64')}}:{};fetch('http://127.0.0.1:4096/global/health',auth).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
startupProbe:
  exec:
    command:
      - node
      - -e
      - >-
        const auth=process.env.OPENCODE_SERVER_PASSWORD?{headers:{Authorization:'Basic '+Buffer.from((process.env.OPENCODE_SERVER_USERNAME||'opencode')+':'+process.env.OPENCODE_SERVER_PASSWORD).toString('base64')}}:{};fetch('http://127.0.0.1:4096/global/health',auth).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
  periodSeconds: 5
  timeoutSeconds: 5
  failureThreshold: 24
nodeSelector: {}
tolerations: []
affinity: {}
